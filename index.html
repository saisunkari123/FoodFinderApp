<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FoodFinder — Restaurant Recommendation App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      min-height: 100vh;
      color: #2d3748;
      padding: 20px 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      border-top: 4px solid #000;
    }

    header h1 {
      font-size: 2.5em;
      color: #000;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    header p {
      color: #666;
      font-size: 1.1em;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .search-section {
      background: white;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    .search-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 600;
      color: #2d3748;
      font-size: 0.95em;
    }

    input[type="text"],
    select {
      padding: 12px 15px;
      font-size: 1em;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    button {
      padding: 12px 25px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #000;
      color: white;
      flex: 1;
      border: 2px solid #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #222;
      border-color: #222;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .btn-secondary {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      flex: 1;
    }

    .btn-secondary:hover {
      background: #000;
      color: #fff;
    }

    .filter-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sort-options {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .sort-options label {
      font-weight: 600;
      color: #2d3748;
    }

    .sort-options select {
      padding: 8px 12px;
      font-size: 0.95em;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      border-left: 4px solid #000;
    }

    .status-text {
      font-weight: 600;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e2e8f0;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      border: 1px solid #f0f0f0;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      border-color: #e0e0e0;
    }

    .card-image-container {
      position: relative;
      overflow: hidden;
      height: 200px;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-thumb {
      transform: scale(1.1);
    }

    .rating-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 14px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
    }

    .fav-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .fav-btn:hover {
      transform: scale(1.1);
    }

    .fav-btn.favorited {
      color: #e74c3c;
    }

    .card-content {
      padding: 20px;
    }

    .card-title {
      font-size: 1.3em;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .cuisine-badge {
      display: inline-block;
      background: #000;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-address {
      font-size: 0.95em;
      color: #718096;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .card-address i {
      margin-top: 2px;
      color: #000;
      flex-shrink: 0;
    }

    .card-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card-btn {
      padding: 10px 15px;
      font-size: 0.95em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .card-btn.recipe {
      background: #000;
      color: white;
    }

    .card-btn.recipe:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    .card-btn.remove {
      background: #fee;
      color: #e74c3c;
      border: 2px solid #e74c3c;
    }

    .card-btn.remove:hover {
      background: #e74c3c;
      color: white;
    }

    #message {
      text-align: center;
      padding: 40px;
      color: #718096;
      font-size: 1.2em;
    }

    footer {
      background: white;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      color: #718096;
      font-size: 0.95em;
      margin-top: 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    footer a {
      color: #000;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .empty-state i {
      font-size: 4em;
      color: #cbd5e0;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      color: #2d3748;
      margin-bottom: 10px;
    }

    @media (max-width: 1024px) {
      .search-controls {
        grid-template-columns: 1fr 1fr;
      }

      .button-group {
        grid-column: 1 / -1;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
    }

    @media (max-width: 640px) {
      header h1 {
        font-size: 1.8em;
        flex-direction: column;
      }

      .search-controls {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card-footer {
        grid-template-columns: 1fr;
      }

      .sort-options {
        flex-direction: column;
        align-items: flex-start;
      }

      .status-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-utensils"></i> FoodFinder</h1>
      <p>Discover the Best Restaurants & Dishes Near You</p>
    </header>

    <div class="search-section">
      <div class="search-controls">
        <div class="form-group">
          <label for="search"><i class="fas fa-search"></i> Search by Dish Name</label>
          <input type="text" id="search" placeholder="e.g., Chicken Biryani, Pizza..." />
        </div>
        <div class="form-group">
          <label for="area"><i class="fas fa-globe"></i> or Filter by Cuisine</label>
          <select id="area">
            <option value="">--Select Cuisine--</option>
            <option>American</option>
            <option>British</option>
            <option>Canadian</option>
            <option>Chinese</option>
            <option>French</option>
            <option>Indian</option>
            <option>Italian</option>
            <option>Mexican</option>
            <option>Japanese</option>
            <option>Greek</option>
            <option>Mediterranean</option>
            <option>Thai</option>
          </select>
        </div>
        <div class="button-group">
          <button id="go" class="btn-primary"><i class="fas fa-search"></i> Search</button>
          <button id="showFavs" class="btn-secondary"><i class="fas fa-heart"></i> Favorites</button>
        </div>
      </div>

      <div class="sort-options" style="display: none;" id="sortContainer">
        <label for="sortBy">Sort by:</label>
        <select id="sortBy">
          <option value="default">Default</option>
          <option value="rating-high">Rating (High to Low)</option>
          <option value="rating-low">Rating (Low to High)</option>
          <option value="name">Name (A-Z)</option>
        </select>
      </div>
    </div>

    <div id="statusBar" class="status-bar" style="display: none;">
      <div class="status-text" id="statusText">
        <span class="loading"></span>
        <span id="statusMessage">Loading...</span>
      </div>
    </div>

    <main>
      <div id="results" class="grid"></div>
      <div id="message"></div>
    </main>

    <footer>
      <p>📊 Data sourced from <a href="https://www.themealdb.com/" target="_blank">TheMealDB API</a> • Ratings & addresses are for demonstration purposes</p>
      <p style="margin-top: 10px; font-size: 0.9em;">✨ Favorite your dishes using local storage - they'll be saved even after you close the browser!</p>
    </footer>
  </div>

  <script>
    // DOM Elements
    const resultsEl = document.getElementById('results');
    const messageEl = document.getElementById('message');
    const searchEl = document.getElementById('search');
    const areaEl = document.getElementById('area');
    const goBtn = document.getElementById('go');
    const showFavsBtn = document.getElementById('showFavs');
    const sortByEl = document.getElementById('sortBy');
    const sortContainer = document.getElementById('sortContainer');
    const statusBar = document.getElementById('statusBar');
    const statusMessage = document.getElementById('statusMessage');

    let currentMeals = [];
    let currentView = 'search'; // 'search' or 'favorites'

    // Utility Functions
    function randRating() {
      return (Math.random() * 1.5 + 3.5).toFixed(1);
    }

    function fakeAddress(area) {
      const streets = ['Market St', 'Lakeview Rd', 'Central Ave', 'Park Lane', '1st Cross', 'MG Road', 'Station Rd', 'Sunset Blvd', 'Main St', 'Broadway'];
      const cities = [area || 'Local Area', 'Downtown', 'Midtown', 'Uptown', 'Westside'];
      const distance = (Math.random() * 2 + 0.1).toFixed(2);
      return `${Math.floor(Math.random() * 200) + 1} ${streets[Math.floor(Math.random() * streets.length)]}, ${cities[Math.floor(Math.random() * cities.length)]} — ${distance} km`;
    }

    function showStatus(show = true, message = 'Loading...') {
      if (show) {
        statusBar.style.display = 'flex';
        statusMessage.textContent = message;
      } else {
        statusBar.style.display = 'none';
      }
    }

    function isFavorited(idMeal) {
      const arr = JSON.parse(localStorage.getItem('foodfinder_favs') || '[]');
      return arr.some(m => m.idMeal === idMeal);
    }

    function saveFav(meal) {
      const key = 'foodfinder_favs';
      const arr = JSON.parse(localStorage.getItem(key) || '[]');
      if (arr.find(m => m.idMeal === meal.idMeal)) {
        showNotification('Already in favorites!', 'info');
        return;
      }
      arr.push(meal);
      localStorage.setItem(key, JSON.stringify(arr));
      showNotification('✓ Added to favorites!', 'success');
      updateFavButton(meal.idMeal);
    }

    function removeFav(idMeal) {
      const key = 'foodfinder_favs';
      let arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr = arr.filter(m => m.idMeal !== idMeal);
      localStorage.setItem(key, JSON.stringify(arr));
      showNotification('✓ Removed from favorites!', 'success');
      updateFavButton(idMeal);
      if (currentView === 'favorites') {
        renderFavorites();
      }
    }

    function updateFavButton(idMeal) {
      const btn = document.querySelector(`[data-id="${idMeal}"].fav-btn`);
      if (btn) {
        if (isFavorited(idMeal)) {
          btn.textContent = '❤️';
          btn.classList.add('favorited');
        } else {
          btn.textContent = '🤍';
          btn.classList.remove('favorited');
        }
      }
    }

    function showNotification(msg, type = 'info') {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 25px;
        background: ${type === 'success' ? '#28a745' : '#000'};
        color: white;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        z-index: 1000;
        animation: slideIn 0.3s ease;
        font-weight: 600;
      `;
      notification.textContent = msg;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }

    // Create styles for animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(400px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    `;
    document.head.appendChild(style);

    function sortMeals(meals, sortType) {
      const sorted = [...meals];
      switch (sortType) {
        case 'rating-high':
          return sorted.sort((a, b) => parseFloat(b._rating) - parseFloat(a._rating));
        case 'rating-low':
          return sorted.sort((a, b) => parseFloat(a._rating) - parseFloat(b._rating));
        case 'name':
          return sorted.sort((a, b) => a.strMeal.localeCompare(b.strMeal));
        default:
          return sorted;
      }
    }

    function renderMealCard(meal, isFavView = false) {
      const div = document.createElement('div');
      div.className = 'card';
      const isFav = isFavorited(meal.idMeal);
      const favText = isFav ? '❤️' : '🤍';
      
      div.innerHTML = `
        <div class="card-image-container">
          <img class="card-thumb" src="${meal.strMealThumb}" alt="${meal.strMeal}">
          <div class="rating-badge">
            <i class="fas fa-star"></i> ${meal._rating}
          </div>
          <button class="fav-btn" data-id="${meal.idMeal}" title="Add to favorites">${favText}</button>
        </div>
        <div class="card-content">
          <h3 class="card-title">${meal.strMeal}</h3>
          <div class="cuisine-badge">${meal._cuisine || 'Cuisine'}</div>
          <div class="card-address">
            <i class="fas fa-map-marker-alt"></i>
            <span>${meal._address}</span>
          </div>
          <div class="card-footer">
            <button class="card-btn recipe" data-id="${meal.idMeal}">
              <i class="fas fa-book"></i> Recipe
            </button>
            ${isFavView ? `<button class="card-btn remove" data-id="${meal.idMeal}">
              <i class="fas fa-trash"></i> Remove
            </button>` : `<button class="card-btn recipe" style="grid-column: 1/-1; background: #f5f5f5; color: #000; border: 2px solid #ddd;" data-id="${meal.idMeal}" data-view="info">
              <i class="fas fa-info-circle"></i> More Info
            </button>`}
          </div>
        </div>
      `;

      // Event listeners
      const favBtn = div.querySelector('.fav-btn');
      favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isFavorited(meal.idMeal)) {
          removeFav(meal.idMeal);
        } else {
          saveFav(meal);
        }
      });

      div.querySelectorAll('.card-btn.recipe[data-view="info"]').forEach(b => {
        b.addEventListener('click', () => {
          showMealDetails(meal);
        });
      });

      div.querySelectorAll('.card-btn.recipe:not([data-view="info"])').forEach(b => {
        b.addEventListener('click', () => {
          window.open(`https://www.themealdb.com/meal/${meal.idMeal}`, '_blank');
        });
      });

      div.querySelectorAll('.card-btn.remove').forEach(b => {
        b.addEventListener('click', () => removeFav(b.dataset.id));
      });

      return div;
    }

    function showMealDetails(meal) {
      alert(`🍽️ ${meal.strMeal}\n\n📍 ${meal._address}\n⭐ Rating: ${meal._rating}\n🍜 Cuisine: ${meal._cuisine}\n\nClick "Recipe" to view full details on TheMealDB!`);
    }

    // API Functions
    async function searchByName(q) {
      showStatus(true, 'Searching for dishes...');
      try {
        const res = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(q)}`);
        const data = await res.json();
        return data.meals || [];
      } catch (err) {
        console.error(err);
        messageEl.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h2>Connection Error</h2><p>Could not fetch data. Please check your internet connection.</p></div>';
        return [];
      }
    }

    async function searchByArea(area) {
      showStatus(true, `Searching ${area} cuisine...`);
      try {
        const res = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?a=${encodeURIComponent(area)}`);
        const data = await res.json();
        if (!data.meals) return [];
        
        const small = data.meals.slice(0, 12);
        const detailed = await Promise.all(small.map(async m => {
          try {
            const r = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${m.idMeal}`);
            const d = await r.json();
            return d.meals ? d.meals[0] : m;
          } catch {
            return m;
          }
        }));
        return detailed;
      } catch (err) {
        console.error(err);
        messageEl.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h2>Connection Error</h2><p>Could not fetch data. Please check your internet connection.</p></div>';
        return [];
      }
    }

    function renderList(meals, areaText) {
      resultsEl.innerHTML = '';
      messageEl.innerHTML = '';

      if (!meals || meals.length === 0) {
        messageEl.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h2>No Results Found</h2><p>Try searching for a different dish or cuisine.</p></div>';
        showStatus(false);
        sortContainer.style.display = 'none';
        return;
      }

      currentMeals = meals.map(meal => ({
        ...meal,
        _rating: meal._rating || randRating(),
        _address: meal._address || fakeAddress(areaText || meal.strArea),
        _cuisine: meal._cuisine || (meal.strArea || 'Unknown')
      }));

      messageEl.innerHTML = `<div style="text-align: center; padding: 10px; color: #000; font-weight: 600;">Found ${currentMeals.length} delicious options</div>`;
      
      sortContainer.style.display = 'flex';
      const sortedMeals = sortMeals(currentMeals, sortByEl.value);
      
      sortedMeals.forEach(meal => {
        resultsEl.appendChild(renderMealCard(meal));
      });

      showStatus(false);
    }

    function renderFavorites() {
      resultsEl.innerHTML = '';
      messageEl.innerHTML = '';
      currentView = 'favorites';
      sortContainer.style.display = 'none';
      
      const arr = JSON.parse(localStorage.getItem('foodfinder_favs') || '[]');
      
      if (!arr.length) {
        messageEl.innerHTML = '<div class="empty-state"><i class="fas fa-heart"></i><h2>No Favorites Yet</h2><p>Start adding your favorite dishes by clicking the heart icon!</p></div>';
        currentMeals = [];
        return;
      }

      currentMeals = arr;
      messageEl.innerHTML = `<div style="text-align: center; padding: 10px; color: #000; font-weight: 600;">You have ${arr.length} favorite${arr.length !== 1 ? 's' : ''}</div>`;
      arr.forEach(m => resultsEl.appendChild(renderMealCard(m, true)));
    }

    // Event Listeners
    goBtn.addEventListener('click', async () => {
      const q = searchEl.value.trim();
      const area = areaEl.value.trim();
      resultsEl.innerHTML = '';
      currentView = 'search';

      if (!q && !area) {
        messageEl.innerHTML = '<div class="empty-state"><i class="fas fa-info-circle"></i><h2>Enter Search Criteria</h2><p>Type a dish name or select a cuisine to get started!</p></div>';
        return;
      }

      if (q) {
        const meals = await searchByName(q);
        renderList(meals, '');
      } else {
        const meals = await searchByArea(area);
        renderList(meals, area);
      }
    });

    showFavsBtn.addEventListener('click', renderFavorites);

    sortByEl.addEventListener('change', () => {
      const sorted = sortMeals(currentMeals, sortByEl.value);
      resultsEl.innerHTML = '';
      sorted.forEach(meal => {
        resultsEl.appendChild(renderMealCard(meal, currentView === 'favorites'));
      });
    });

    // Allow Enter key in search
    searchEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') goBtn.click();
    });

    // Initial demo search
    (async () => {
      currentView = 'search';
      const demo = await searchByArea('Indian');
      renderList(demo.slice(0, 12), 'Indian');
    })();
  </script>
</body>
</html>
